<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Detail úkolu</title>
</head>
<body style="font-family: sans-serif; max-width: 400px; margin: 2rem auto;">
    <a href="/">&larr; Zpět na seznam</a>
    
    <h2><%= task.title %></h2>
    <p>Stav: <strong><%= task.completed === 1 ? '✅ Hotovo' : '❌ Nedokončeno' %></strong></p>
    <p>Priorita: <strong><%= task.priority %></strong></p>
    
    <p>
        <a href="/todo/<%= task.id %>/toggle">Změnit stav</a> | 
        <a href="/todo/<%= task.id %>/delete" style="color: red;">Odstranit</a>
    </p>

    <hr>

    <form action="/todo/<%= task.id %>/edit" method="POST">
        <label>Změnit titulek:</label><br>
        <input type="text" name="title" value="<%= task.title %>" required><br><br>
        
        <label>Změnit prioritu:</label><br>
        <select name="priority">
            <option value="low" <%= task.priority === 'low' ? 'selected' : '' %>>Nízká</option>
            <option value="normal" <%= task.priority === 'normal' ? 'selected' : '' %>>Normální</option>
            <option value="high" <%= task.priority === 'high' ? 'selected' : '' %>>Vysoká</option>
        </select><br><br>
        
        <button type="submit">Uložit změnu</button>
    </form>
    <script>
        const ws = new WebSocket(`ws://${location.host}`);
        // Přihlášení k odběru změn POUZE tohoto konkrétního úkolu
        ws.onopen = () => ws.send(JSON.stringify({ type: 'subscribe', topic: 'detail:<%= task.id %>' }));
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // Řešení bonusového bodu
            if (data.type === 'deleted') {
                document.body.innerHTML = `
                    <h2>Tento úkol byl odstraněn v jiném okně.</h2>
                    <a href="/">&larr; Zpět na seznam</a>
                `;
            } else if (data.type === 'update') {
                // Okamžitá aktualizace stránky bez reloadu
                location.reload(); 
            }
        };
    </script>
</body>
</html>
