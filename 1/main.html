<!DOCTYPE html>
<html>
<head>
    <title>Hádání čísla</title>
</head>
<body>
    <script>
        const hadaneCislo = Math.floor(Math.random() * 11);
        let pokusy = 5;
        let vyhra = false;

        alert("Myslím si číslo od 0 do 10. Máš 5 pokusů na to ho uhodnout.");

        while (pokusy > 0) {
            const tip = parseInt(prompt(`Zadej svůj tip (zbývá ${pokusy} pokusů):`));

            if (tip === hadaneCislo) {
                alert("Správně! Vyhrál jsi.");
                vyhra = true;
                break;
            } else if (tip < hadaneCislo) {
                alert("Moje číslo je větší.");
            } else {
                alert("Moje číslo je menší.");
            }

            pokusy--;
        }

        if (!vyhra) {
            alert(`Prohrál jsi! Moje číslo bylo ${hadaneCislo}.`);
        }
    </script>
</body>
</html>
